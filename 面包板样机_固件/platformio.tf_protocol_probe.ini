[platformio]
src_dir = diagnostics/tf_protocol_probe
build_dir = .pio/tf_protocol_probe
default_envs = tf_1bit_20m, tf_1bit_400k, tf_4bit_400k, tf_spi_1m, tf_spi_4m

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

[env:tf_1bit_20m]
build_flags = ${env.build_flags} -DTF_WIDTH=1 -DTF_FREQ_KHZ=20000

[env:tf_1bit_400k]
build_flags = ${env.build_flags} -DTF_WIDTH=1 -DTF_FREQ_KHZ=400

[env:tf_4bit_400k]
build_flags = ${env.build_flags} -DTF_WIDTH=4 -DTF_FREQ_KHZ=400

[env:tf_spi_1m]
build_flags = ${env.build_flags} -DTF_SPI=1 -DTF_FREQ_KHZ=1000

[env:tf_spi_4m]
build_flags = ${env.build_flags} -DTF_SPI=1 -DTF_FREQ_KHZ=4000

[env:tf_arduino_spi_1m]
build_flags = ${env.build_flags} -DTF_ARDUINO_SPI=1 -DTF_FREQ_KHZ=1000

[env:tf_arduino_spi_400k]
build_flags = ${env.build_flags} -DTF_ARDUINO_SPI=1 -DTF_FREQ_KHZ=400
