; ============================================================
;  面包板样机 · 固件工程（C 混合路线）
;  目标板：立创·ESP32S3R8N8 (C20626143) / ESP32-S3 / 8MB Flash / 8MB PSRAM
;  配套文档：面包板样机_到货验收与施工准备包.html
; ============================================================
[env:breadboard]
; ---- 实测环境（2026-09-18 编译通过）----
;   PlatformIO 6.2.0 + espressif32@7.1.3
;   framework-arduinoespressif32 4.20017  =  Arduino-ESP32 2.0.17
;   → SD_MMC 用「setPins() + begin()」写法（见 src/recorder.cpp 的注释）
; 注：本机编译前需先关闭安全删除钩子，否则 SCons 删临时文件时会被拦到中途失败：
;     bash:       export CODEBUDDY_SAFE_DELETE_ENABLED=0
;     PowerShell: $env:CODEBUDDY_SAFE_DELETE_ENABLED=0
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/block_implicit_upload.py

monitor_port  = COM5
monitor_speed = 115200
monitor_echo  = yes
upload_speed  = 921600

; 立创板为 8MB QIO Flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; 若编译报「找不到 default_8MB.csv」，把下面这行注释掉即可（改用默认 4MB 分区）
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=f_mount
    -Wl,--wrap=sdmmc_card_init
    -Wl,--wrap=sdmmc_host_do_transaction
