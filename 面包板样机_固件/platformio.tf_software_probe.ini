; Independent read-only software isolation build; main firmware is unchanged.
[platformio]
src_dir = diagnostics/tf_software_probe
build_dir = .pio/tf_software_probe
default_envs = tf_wait_300ms, tf_wait_5000ms

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

[env:tf_wait_300ms]
build_flags =
    ${env.build_flags}
    -DTF_WAIT_MS=300

[env:tf_wait_5000ms]
build_flags =
    ${env.build_flags}
    -DTF_WAIT_MS=5000
