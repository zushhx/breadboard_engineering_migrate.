[env:sensor_monitor_idf542]
extra_scripts = pre:block_implicit_upload.py
platform = espressif32@6.11.0
platform_packages =
    platformio/framework-espidf@3.50402.0
    ; ULP is disabled; reuse the existing unused RISC-V compiler package.
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -DTF_NATIVE_IDF=1 -DTF_WIDTH=4 -DTF_FREQ_KHZ=20000
